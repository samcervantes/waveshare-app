; Waveshare ESP32-C6 1.47" Touch Display app launcher
; https://amzn.to/461uJnQ
; (also supports the older plain, non-touch Waveshare ESP32-C6-LCD-1.47 -
; see the waveshare-esp32c6-lcd147 env below)

[env:waveshare-esp32c6-lcd147]
; PlatformIO's official espressif32 platform hasn't added Arduino framework
; support to its ESP32-C6 board defs yet (espidf only), so this uses the
; community pioarduino fork instead: https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

; The default partition table splits the 4MB flash for OTA (two ~1.3MB app
; slots). We don't use OTA and WiFi.h alone pulls in enough of the TLS/
; network stack to blow past that limit, so use a single larger app
; partition instead (no OTA, ~3MB for the app).
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM=0

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ^8.3.11
    adafruit/Adafruit NeoPixel @ ^1.12.3
    bblanchon/ArduinoJson @ ^7.2.0

; Waveshare ESP32-C6-Touch-LCD-1.47 - same 172x320 panel size but a
; different board: JD9853 display driver (not ST7789) on different SPI
; pins, BOOT button on GPIO8 instead of GPIO9, no onboard NeoPixel, plus an
; AXS5106L touch controller and QMI8658A IMU (not wired up yet).
; https://docs.waveshare.com/ESP32-C6-Touch-LCD-1.47
; JD9853 speaks the same command set as ST7789, so display.cpp reuses
; LovyanGFX's Panel_ST7789 driver unchanged - only include/config.h's pins
; differ, selected here via -DBOARD_TOUCH_LCD147. See config.h for pins.
[env:waveshare-esp32c6-touch-lcd147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM=0
    -DBOARD_TOUCH_LCD147

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ^8.3.11
    adafruit/Adafruit NeoPixel @ ^1.12.3
    bblanchon/ArduinoJson @ ^7.2.0
