<svg xmlns="http://www.w3.org/2000/svg" width="306" height="528" viewBox="0 0 204 352" font-family="Helvetica, Arial, sans-serif">
  <!-- Bezel -->
  <rect x="0" y="0" width="204" height="352" rx="30" fill="#161618"/>
  <rect x="198" y="140" width="8" height="40" rx="3" fill="#2A2A2C"/>

  <g transform="translate(16,16)">
    <!-- Screen -->
    <rect x="0" y="0" width="172" height="320" rx="18" fill="#000000"/>

    <!-- WiFi status glyph, top-right -->
    <g transform="translate(150,12)" fill="#FFFFFF">
      <rect x="0" y="8" width="3" height="4" rx="1"/>
      <rect x="5" y="5" width="3" height="7" rx="1"/>
      <rect x="10" y="2" width="3" height="10" rx="1"/>
    </g>

    <!-- Page 1: Clock, Bounce -->
    <!-- Clock tile (selected: white highlight border, matches cursor start position) -->
    <rect x="36" y="24" width="100" height="100" rx="23" fill="#0A84FF" stroke="#FFFFFF" stroke-width="4"/>
    <g transform="translate(86,74)" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
      <path d="M 10.72,9.00 A 14,14 0 1,1 10.72,-9.00"/>
      <polygon points="16.51,-2.10 5.61,-7.32 13.27,-13.75" fill="#FFFFFF" stroke="none"/>
    </g>
    <text x="86" y="144" fill="#FFFFFF" font-size="14" text-anchor="middle">Clock</text>

    <!-- Bounce tile -->
    <rect x="36" y="172" width="100" height="100" rx="23" fill="#FF375F"/>
    <g transform="translate(86,222)" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
      <line x1="-15" y1="-15" x2="15" y2="15"/>
      <line x1="-15" y1="15" x2="15" y2="-15"/>
    </g>
    <text x="86" y="292" fill="#FFFFFF" font-size="14" text-anchor="middle">Bounce</text>

    <!-- Page dots: 7 pages, page 1 active -->
    <g transform="translate(34,304)">
      <circle cx="4" cy="4" r="4" fill="#FFFFFF"/>
      <circle cx="20" cy="4" r="4" fill="#555555"/>
      <circle cx="36" cy="4" r="4" fill="#555555"/>
      <circle cx="52" cy="4" r="4" fill="#555555"/>
      <circle cx="68" cy="4" r="4" fill="#555555"/>
      <circle cx="84" cy="4" r="4" fill="#555555"/>
      <circle cx="100" cy="4" r="4" fill="#555555"/>
    </g>
  </g>
</svg>
