<svg xmlns="http://www.w3.org/2000/svg" width="306" height="528" viewBox="0 0 204 352" font-family="Helvetica, Arial, sans-serif">
  <!-- Bezel -->
  <rect x="0" y="0" width="204" height="352" rx="30" fill="#161618"/>
  <rect x="198" y="140" width="8" height="40" rx="3" fill="#2A2A2C"/>

  <g transform="translate(16,16)">
    <!-- Screen -->
    <rect x="0" y="0" width="172" height="320" rx="18" fill="#000000"/>

    <!-- WiFi status glyph, top-right -->
    <g transform="translate(150,12)" fill="#FFFFFF">
      <rect x="0" y="8" width="3" height="4" rx="1"/>
      <rect x="5" y="5" width="3" height="7" rx="1"/>
      <rect x="10" y="2" width="3" height="10" rx="1"/>
    </g>

    <!-- Photos tile (selected: white highlight border) -->
    <rect x="36" y="24" width="100" height="100" rx="23" fill="#FF2D55" stroke="#FFFFFF" stroke-width="4"/>
    <g transform="translate(36,24)">
      <clipPath id="photoClip">
        <rect x="21" y="40" width="58" height="44" rx="5"/>
      </clipPath>
      <rect x="21" y="40" width="58" height="44" rx="5" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="34" cy="52" r="6" fill="#FFFFFF"/>
      <polygon points="21,84 38,60 50,72 62,52 79,84" fill="#FFFFFF" clip-path="url(#photoClip)"/>
    </g>
    <text x="86" y="144" fill="#FFFFFF" font-size="14" text-anchor="middle">Photos</text>

    <!-- Birds tile: custom-drawn bird face icon (see birds_app.cpp's
         build_bird_icon), not a single symbol glyph. -->
    <rect x="36" y="172" width="100" height="100" rx="23" fill="#E8452C"/>
    <g transform="translate(36,172)">
      <!-- Head tuft: three feather spikes fanned like a mohawk -->
      <g transform="translate(24,24) rotate(-45)"><rect x="-4" y="-16" width="8" height="22" rx="4" fill="#1A1A1A"/></g>
      <g transform="translate(29,17) rotate(-15)"><rect x="-4" y="-18" width="8" height="24" rx="4" fill="#1A1A1A"/></g>
      <g transform="translate(38,15) rotate(18)"><rect x="-3.5" y="-15" width="7" height="20" rx="3.5" fill="#1A1A1A"/></g>
      <!-- Belly -->
      <circle cx="46" cy="75" r="24" fill="#F5D9A8"/>
      <!-- Beak, pointed -->
      <g transform="translate(76,58) rotate(45)"><rect x="-11" y="-14" width="22" height="28" rx="3" fill="#FFA500"/></g>
      <!-- Eye, with highlight glint -->
      <circle cx="58" cy="34" r="14" fill="#FFFFFF"/>
      <circle cx="62.5" cy="34" r="6.5" fill="#000000"/>
      <circle cx="60" cy="30.5" r="2" fill="#FFFFFF"/>
      <!-- Eyebrow -->
      <g transform="translate(52,17) rotate(-25)"><rect x="-12" y="-3.5" width="24" height="7" rx="3.5" fill="#1A1A1A"/></g>
    </g>
    <text x="86" y="292" fill="#FFFFFF" font-size="14" text-anchor="middle">Birds</text>

    <!-- Page dots: 7 pages -->
    <g transform="translate(34,304)">
      <circle cx="4" cy="4" r="4" fill="#FFFFFF"/>
      <circle cx="20" cy="4" r="4" fill="#555555"/>
      <circle cx="36" cy="4" r="4" fill="#555555"/>
      <circle cx="52" cy="4" r="4" fill="#555555"/>
      <circle cx="68" cy="4" r="4" fill="#555555"/>
      <circle cx="84" cy="4" r="4" fill="#555555"/>
      <circle cx="100" cy="4" r="4" fill="#555555"/>
    </g>
  </g>
</svg>
